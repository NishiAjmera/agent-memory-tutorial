<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Memory — 6 Levels</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;

    --l1: #3fb950; /* green  - session */
    --l2: #d2a8ff; /* purple - multi-agent */
    --l3: #ffa657; /* orange - persistence */
    --l4: #ff7b72; /* red    - callbacks */
    --l5: #79c0ff; /* blue   - custom tools */
    --l6: #f78166; /* coral  - multimodal */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
  header p  { font-size: 13px; color: var(--muted); }
  .google-badge {
    margin-left: auto;
    background: #1f2937;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ── Level Nav ── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    gap: 2px;
    overflow-x: auto;
  }
  nav button {
    background: none;
    border: none;
    color: var(--muted);
    padding: 12px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  nav button .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }

  /* ── Main layout ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
    height: calc(100vh - 109px);
    overflow: hidden;
  }

  /* ── Left panel: info ── */
  .info-panel {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .level-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid;
    width: fit-content;
  }
  .level-title { font-size: 22px; font-weight: 700; }
  .level-desc  { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ── Diagram ── */
  .diagram {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .diagram svg { width: 100%; }

  /* ── Concepts ── */
  .concepts h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; }
  .concept-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .concept-item:last-child { border-bottom: none; }
  .concept-item .icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .concept-item code {
    background: #21262d;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
    font-family: "SF Mono", Consolas, monospace;
    color: var(--accent);
  }

  /* ── Right panel: demo ── */
  .demo-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .demo-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .demo-header h2 { font-size: 14px; font-weight: 600; }
  .demo-header p  { font-size: 12px; color: var(--muted); }

  .demo-controls {
    display: flex;
    gap: 8px;
  }
  .btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #21262d; }
  .btn.primary {
    border-color: var(--accent);
    background: rgba(88, 166, 255, .1);
    color: var(--accent);
  }

  /* ── Extra info panels (state viewer, etc.) ── */
  .extra-pane {
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    background: #0d1117;
    font-size: 11px;
    font-family: "SF Mono", Consolas, monospace;
    color: var(--muted);
    max-height: 110px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .extra-pane .label { color: var(--accent); font-weight: 600; margin-bottom: 4px; font-family: sans-serif; font-size: 11px; }

  /* ── Chat ── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg.user .avatar { background: rgba(88,166,255,.2); }
  .msg.agent .avatar { background: #21262d; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: rgba(88,166,255,.15);
    border: 1px solid rgba(88,166,255,.3);
    border-top-right-radius: 2px;
  }
  .msg.agent .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 2px;
  }
  .msg.agent.thinking .bubble { opacity: .5; }

  .typing-dots span {
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--muted);
    border-radius: 50%;
    margin: 0 1px;
    animation: bounce .8s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

  /* ── Input ── */
  .chat-input {
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .chat-input input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .chat-input input:focus { border-color: var(--accent); }
  .chat-input button {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: opacity .15s;
  }
  .chat-input button:hover { opacity: .85; }
  .chat-input button:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Suggestions ── */
  .suggestions {
    padding: 0 16px 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .suggestion {
    background: #21262d;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .suggestion:hover { color: var(--text); border-color: var(--accent); }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
  }
  .empty-state .emoji { font-size: 36px; }
  .empty-state p { font-size: 13px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🧠 Agent Memory — 6 Levels</h1>
    <p>Google ADK · Interactive Walkthrough</p>
  </div>
  <div class="google-badge">google-adk · gemini-3.5-flash</div>
</header>

<nav id="levelNav"></nav>

<main>
  <div class="info-panel" id="infoPanel"></div>
  <div class="demo-panel" id="demoPanel"></div>
</main>

      </defs>
    </svg>`,
  },
  {
    id: 6,
    name: "Multimodal Memory",

    concepts: [
      { icon: "🧩", text: "VertexAiMemoryBankService — unified multimodal store" },

      { icon: "💉", text: "PreloadMemoryTool auto-injects past experiences as context" },
      { icon: "📁", text: "Custom memory topics organize different content types" },
    ],
    apiEndpoint: "/api/level6",
    extraLabel: "Memory Bank (stored entries)",
    extraKey: "memory_bank",
    suggestions: [
      "I just watched a video about coral reefs.",
      "I have an image of the Eiffel Tower from my trip.",
      "What multimodal memories do you have?",
      "Tell me about the reef video.",
    ],
    diagramSvg: `<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="47" width="70" height="36" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
      <text x="45" y="65" text-anchor="middle" fill="#e6edf3" font-size="11">Text/Image</text>
      <text x="45" y="78" text-anchor="middle" fill="#8b949e" font-size="10">Video/Audio</text>

      <text x="260" y="27" text-anchor="middle" fill="#f78166" font-size="10">PreloadMemoryTool</text>
      <rect x="210" y="95" width="100" height="25" rx="5" fill="#21262d" stroke="#f78166" stroke-width="1.5"/>
      <text x="260" y="112" text-anchor="middle" fill="#f78166" font-size="10">Agent + Context</text>
      <line x1="80" y1="65" x2="105" y2="65" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr6)"/>

  },

let currentLevel = 0;
let chatHistories = LEVELS.map(() => []);
const USER_ID = "demo_user_" + Math.random().toString(36).slice(2, 8);

function renderNav() {
  const nav = document.getElementById("levelNav");
  nav.innerHTML = LEVELS.map((l, i) => `
    <button class="${i === currentLevel ? "active" : ""}" onclick="switchLevel(${i})">
      <span class="dot" style="background:${l.color}"></span>
      ${l.id}. ${l.name}
    </button>
  `).join("");
}

function renderInfo(l) {
  document.getElementById("infoPanel").innerHTML = `
    <div>
      <div class="level-badge" style="color:${l.color};border-color:${l.color};background:${l.color}18">
        ${l.emoji} Level ${l.id}
      </div>
      <div style="margin-top:10px" class="level-title">${l.name}</div>
      <div style="margin-top:6px;font-size:13px;color:${l.color}">${l.tagline}</div>
    </div>

    <div class="diagram">${l.diagramSvg}</div>

    <p class="level-desc">${l.desc}</p>

    <div class="concepts">
      <h3>Key Concepts</h3>
      ${l.concepts.map(c => `
        <div class="concept-item">
          <span class="icon">${c.icon}</span>
          <span>${c.text}</span>
        </div>
      `).join("")}
    </div>
  `;
}

function renderDemo(l, idx) {
  const panel = document.getElementById("demoPanel");
  const msgs = chatHistories[idx];

  const extraHtml = l.extraLabel ? `
    <div class="extra-pane" id="extraPane">
      <div class="label">${l.extraLabel}</div>
      <span id="extraContent" style="color:#8b949e">—</span>
    </div>` : "";

  const msgsHtml = msgs.length === 0
    ? `<div class="empty-state">
        <div class="emoji">${l.emoji}</div>
        <p>Try one of the suggestions below to demo <strong>${l.name}</strong></p>
      </div>`
    : msgs.map(m => `
      <div class="msg ${m.role}">
        <div class="avatar">${m.role === "user" ? "👤" : "🤖"}</div>
        <div class="bubble ${m.thinking ? "thinking" : ""}">
          ${m.thinking ? `<div class="typing-dots"><span></span><span></span><span></span></div>` : escapeHtml(m.text)}
        </div>
      </div>
    `).join("");

  panel.innerHTML = `
    <div class="demo-header">
      <div>
        <h2>Live Demo — Level ${l.id}: ${l.name}</h2>
        <p>Powered by google-adk + gemini-3.5-flash</p>
      </div>
      <div class="demo-controls">
        <button class="btn" onclick="resetChat(${idx})">↺ Reset</button>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">${msgsHtml}</div>

    ${extraHtml}

    <div class="suggestions">
      ${l.suggestions.map(s => `<div class="suggestion" onclick="fillInput(${JSON.stringify(s)})">${s}</div>`).join("")}
    </div>

    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendMsg(${idx})" />
      <button id="sendBtn" onclick="sendMsg(${idx})">Send</button>
    </div>
  `;
  scrollToBottom();
}

function render() {
  const l = LEVELS[currentLevel];
  renderNav();
  renderInfo(l);
  renderDemo(l, currentLevel);
}

function switchLevel(idx) {
  currentLevel = idx;
  render();
}

function fillInput(text) {
  document.getElementById("chatInput").value = text;
  document.getElementById("chatInput").focus();
}

function scrollToBottom() {
  setTimeout(() => {
    const el = document.getElementById("chatMessages");
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function updateExtra(data) {
  const el = document.getElementById("extraContent");
  if (!el) return;
  const l = LEVELS[currentLevel];
  if (!l.extraKey) return;
  const val = data[l.extraKey];
  if (!val) return;
  if (typeof val === "object") {
    el.textContent = JSON.stringify(val, null, 2);
  } else if (Array.isArray(val) && val.length === 0) {
    el.textContent = "(empty)";
  } else {
    el.textContent = typeof val === "string" ? val : JSON.stringify(val);
  }
}

async function sendMsg(idx) {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";

  const l = LEVELS[idx];
  chatHistories[idx].push({ role: "user", text });
  chatHistories[idx].push({ role: "agent", text: "", thinking: true });

  const sendBtn = document.getElementById("sendBtn");
  if (sendBtn) sendBtn.disabled = true;

  renderDemo(l, idx);

  try {
    const res = await fetch(l.apiEndpoint + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, user_id: USER_ID }),
    });
    const data = await res.json();

    // Remove thinking bubble
    chatHistories[idx].pop();
    chatHistories[idx].push({ role: "agent", text: data.reply || data.error || "(no response)" });

    renderDemo(l, idx);
    updateExtra(data);
  } catch (err) {
    chatHistories[idx].pop();
    chatHistories[idx].push({ role: "agent", text: "Error: " + err.message });
    renderDemo(l, idx);
  }
}

async function resetChat(idx) {
  const l = LEVELS[idx];
  chatHistories[idx] = [];
  try {
    await fetch(l.apiEndpoint + "/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: USER_ID }),
    });
  } catch (_) {}
  renderDemo(l, idx);
}

render();
</script>
